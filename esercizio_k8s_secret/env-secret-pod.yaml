apiVersion: v1
kind: Pod

metadata:
  name: env-secret-pod

spec:
  containers:
    - name: env-secret-container
      image: alpine
      command: ["sleep", "3600"]

      env:
        - name: MY_SECRET_USERNAME
          valueFrom:
            secretKeyRef:
              name: new-user-pass
              key: username

        - name: MY_SECRET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: new-user-pass
              key: password
